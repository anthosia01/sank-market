<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Aroma-Leaf — visuel produit</title>
<link rel="stylesheet" href="../site/fonts/fonts.css">
<style>
  /* Visuel 1080×1350 : champ couleur du thé en haut, bandeau vert profond Aroma-Leaf en bas */
  :root { --green:#0f3328; --green-2:#16453a; --gold:#c9a24a; --gold-2:#e6c77a; --ivory:#f7f0e1;
          --display:"Gloock", Georgia, serif; --body:"Figtree", "Segoe UI", Arial, sans-serif; }
  * { box-sizing:border-box; margin:0 }
  html,body { width:1080px; height:1350px; background:var(--green) }
  body { font-family:var(--body); color:var(--ivory); overflow:hidden }
  .post { position:relative; width:1080px; height:1350px; display:grid; grid-template-rows:1fr auto }
  .field { position:relative; background:var(--c); color:var(--ink); padding:52px 64px 50px; overflow:hidden; display:flex; flex-direction:column }
  .field::before { content:""; position:absolute; inset:0;
    background: radial-gradient(circle at 50% 30%, rgba(255,255,255,.2), transparent 45%),
                linear-gradient(180deg, transparent 55%, rgba(0,0,0,.22)); }
  .field > * { position:relative }
  .top { display:flex; justify-content:space-between; align-items:center }
  .brand { display:flex; align-items:center; gap:18px }
  .brand svg { width:76px; height:76px }
  .brand b { font-family:var(--display); font-weight:400; font-size:40px; display:block; line-height:1 }
  .brand small { font-size:15px; font-weight:600; letter-spacing:.34em; text-transform:uppercase; opacity:.8 }
  .origin { font-size:15px; font-weight:600; letter-spacing:.3em; text-transform:uppercase; text-align:right; line-height:1.7; opacity:.85 }
  .stage { position:relative; flex:1; min-height:520px; display:grid; place-items:center; margin:6px 0 4px }
  .ring { position:absolute; width:540px; height:540px; border-radius:50%; border:2px solid rgba(255,255,255,.3) }
  .ring.r2 { width:610px; height:610px; border:1px dashed rgba(255,255,255,.22) }
  .illus { position:relative; width:540px; height:540px; filter:drop-shadow(0 26px 30px rgba(0,0,0,.3)) }
  .text { margin-top:auto }
  .eyebrow { font-size:17px; font-weight:700; letter-spacing:.32em; text-transform:uppercase; opacity:.85 }
  h1 { font-family:var(--display); font-weight:400; font-size:94px; line-height:.98; margin:12px 0 10px; text-wrap:balance }
  .sub { font-size:22px; font-weight:600; opacity:.85 }
  .line { font-size:27px; line-height:1.35; margin-top:18px; max-width:30em }
  .foot { display:flex; justify-content:space-between; align-items:flex-end; gap:24px; margin-top:28px }
  .notes { display:flex; gap:10px; flex-wrap:wrap }
  .notes span { border:1.5px solid currentColor; border-radius:999px; padding:8px 18px; font-size:19px; font-weight:600 }
  .offer { display:flex; gap:14px; flex:none }
  .price { background:var(--green); color:var(--gold-2); border-radius:16px; padding:16px 26px; box-shadow:0 12px 30px rgba(0,0,0,.25) }
  .price small { display:block; font-size:15px; font-weight:600; letter-spacing:.2em; text-transform:uppercase; color:var(--ivory); opacity:.8 }
  .price b { font-family:var(--display); font-weight:400; font-size:46px; line-height:1.15; white-space:nowrap }
  .price b.ask { font-size:30px; line-height:1.75 }
  .band { background:var(--green); padding:34px 64px 38px; display:grid; grid-template-columns:auto 1fr auto; gap:34px; align-items:center; border-top:4px solid var(--gold) }
  .cta { background:var(--gold); color:var(--green); border-radius:14px; padding:18px 26px; font-weight:800; font-size:22px; line-height:1.2; display:flex; align-items:center; gap:14px }
  .cta svg { width:38px; height:38px }
  .phones { font-size:31px; font-weight:700; letter-spacing:.02em; line-height:1.3; font-variant-numeric:tabular-nums; color:var(--ivory) }
  .meta { text-align:right; font-size:19px; line-height:1.6; color:var(--gold-2) }
  .meta span { display:block; color:var(--ivory); opacity:.8 }
</style>
</head>
<body>
<div class="post" id="post"></div>
<script src="../site/data.js"></script>
<script>
  const { PRODUCTS, CONTACT, svg, fcfa, logoMark } = AL;
  const id = new URLSearchParams(location.search).get("id") || PRODUCTS[0].id;
  const p = PRODUCTS.find(x => x.id === id);
  const wa = `<svg viewBox="0 0 32 32"><path fill="currentColor" d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3zm0 23.6c-2 0-4-.6-5.7-1.6l-.4-.2-3.9 1 1-3.8-.3-.4A10.6 10.6 0 1 1 16 26.6zm5.8-7.9c-.3-.2-1.9-.9-2.2-1s-.5-.2-.7.2l-1 1.2c-.2.2-.4.2-.7.1a8.7 8.7 0 0 1-4.3-3.8c-.3-.6.3-.5.9-1.7.1-.2 0-.4 0-.6l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4s-1.2 1.1-1.2 2.8 1.2 3.2 1.4 3.5c.2.2 2.4 3.6 5.8 5 2.1.9 3 1 4 .8.7-.1 1.9-.8 2.2-1.5.3-.8.3-1.4.2-1.5l-.6-.3z"/></svg>`;
  document.getElementById("post").innerHTML = `
    <section class="field" style="--c:${p.color};--ink:${p.ink}">
      <div class="top">
        <div class="brand">${logoMark(p.ink)}<div><b>Aroma-Leaf</b><small>from Kenya</small></div></div>
        <div class="origin">Kericho Gold<br>Thé premium · Kenya</div>
      </div>
      <div class="stage"><div class="ring r2"></div><div class="ring"></div>${svg(p.illus, "illus")}</div>
      <div class="text">
        <div class="eyebrow">${p.family} · Kericho Gold</div>
        <h1>${p.short}</h1>
        <div class="sub">${p.name}</div>
        <p class="line">${p.line}</p>
      </div>
      <div class="foot">
        <div class="notes">${p.notes.map(n => `<span>${n}</span>`).join("")}</div>
        <div class="offer">${p.offers.map(o => `<div class="price"><small>${o.label}</small><b class="${o.price == null ? "ask" : ""}">${fcfa(o.price)}</b></div>`).join("")}</div>
      </div>
    </section>
    <footer class="band">
      <div class="cta">${wa}<span>Commandez<br>sur WhatsApp</span></div>
      <div class="phones">${CONTACT.phones.join("<br>")}</div>
      <div class="meta">Ouaga 2000<span>Facebook · ${CONTACT.facebook}</span></div>
    </footer>`;
</script>
</body>
</html>
